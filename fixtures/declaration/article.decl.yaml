# A declaration — the source form the builder compiles into a CND
# (docs/adr/0019). Note what is absent by construction: no node has an
# `id`, a `location`, a `numbering.value`, or a `heading_path`. The
# builder supplies all of those. What is here is authored content only.
#
# A text is a plain string (the shorthand) or the full rich-text object
# when a producer computes offsets for marks and links
# (docs/proposals/0013, "Declaration").
#
# article.cnd is this declaration's expected build output (`cnd build`,
# unnumbered). Compare the two after erasing every `id` and `built_at`:
# ids are minted fresh per build (docs/adr/0015), and `built_at` is a
# timestamp — neither is reproducible across builds.
declaration_version: "0.2.0"

source:
  type: markdown
  hash: "sha256:1f0a9c7e5b2d84e6"
  uri: articles/handshake.md

doc:
  title: The handshake, declared
  authors:
    - Ada Rivest
  keywords: [protocol, declaration]
  lang: en

nodes:
  - type: heading
    label: sec-handshake
    level: 1
    text: Handshake
    children:
      - type: paragraph
        text:
          value: >-
            The client opens with a version token, as the listing shows,
            following Rivest. See the note on opacity.
          marks:
            - { start: 24, end: 37, kind: emph }
          refs:
            - label: lst-open
              text_span: [39, 57]
          cites:
            - label: rivest1978
              form: prose
          footnotes:
            - label: fn-token

      - type: paragraph
        text:
          value: The handshake is specified at example.org.
          links:
            - href: https://example.org/handshake
              text_span: [30, 41]

      - type: figure
        label: lst-open
        kind: code
        caption: Opening frame
        children:
          - type: code
            text: "OPEN v1\n"
            lang: text
            title: open.txt

      - type: list
        ordered: true
        items:
          # An authored start override — the declaration keeps this, the
          # running ordinal it does not (that is the builder's to resolve).
          - number: 1
            children:
              - type: paragraph
                text: Negotiate the version.
          - children:
              - type: paragraph
                text: Exchange capabilities.
              - type: list
                items:
                  - checked: true
                    children:
                      - { type: paragraph, text: Compression }
                  - checked: false
                    children:
                      - { type: paragraph, text: Encryption }
          - children:
              - { type: paragraph, text: Confirm. }

      - type: admonition
        kind: note
        title: Opacity
        children:
          - type: paragraph
            text: Intermediaries never read the token.

bibliography:
  - label: rivest1978
    type: article
    authors: [Rivest, R.]
    title: On data banks and privacy homomorphisms
    year: 1978

footnotes:
  - label: fn-token
    children:
      - type: paragraph
        text: The version token is opaque to intermediaries.
