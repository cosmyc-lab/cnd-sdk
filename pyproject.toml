[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnd-sdk"
version = "0.1.0"
description = "CND — the Context Native Document standard: manifest schema, node types, and reference Python bindings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
display = [
    "rich>=15.0.0",
    "typing-extensions>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
    "cnd-sdk[display]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
